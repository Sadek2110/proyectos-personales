<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS</title>
<meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A24" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<style>
@font-face { font-family: Barlow; font-weight: 500; font-display: swap; src: url('/fonts/barlow-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url('/fonts/barlow-condensed-latin-600-normal.woff2') format('woff2'); }
:root { --fondo:#EEF1F3; --superficie:#FFFFFF; --raya:#D3DAE0; --texto:#141C2B; --suave:#545F73; --sobre:#FFFFFF; --peligro:#C8102E; --peligro-suave:#FBE4E7;
  --a:#C8102E; --b:#0A7A55; --c:#1546C8; --d:#995700; --e:#7B2D8E; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --fondo:#141A24; --superficie:#1D2531; --raya:#323D4C; --texto:#EDF0F5; --suave:#A9B4C5; --sobre:#10151F; --peligro:#FF7F8B; --peligro-suave:#3B2028;
    --a:#FF7F8B; --b:#4FD1A5; --c:#8AB0FF; --d:#F2B84B; --e:#D59BE8; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--fondo); color: var(--texto); font: 500 16px/1.4 Barlow, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 360px; }
h1 { margin: 0; font: 600 76px/1 'Barlow Condensed', Barlow, sans-serif; }
.red { display: flex; align-items: center; height: 18px; margin: 10px 0 8px; background: linear-gradient(90deg, var(--a) 0 20%, var(--b) 20% 40%, var(--c) 40% 60%, var(--d) 60% 80%, var(--e) 80%) center / 100% 4px no-repeat; justify-content: space-between; }
.red i { width: 18px; height: 18px; border-radius: 50%; background: var(--fondo); border: 4px solid var(--texto); }
p { margin: 0 0 28px; color: var(--suave); }
label { display: block; margin-bottom: 6px; color: var(--suave); }
input { width: 100%; height: 52px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--raya); background: var(--superficie); color: var(--texto); font: inherit; outline: 0; }
input:focus { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); }
button { width: 100%; height: 52px; margin-top: 12px; border: 0; border-radius: 26px; cursor: pointer; background: var(--texto); color: var(--fondo); font: inherit; font-weight: 500; font-size: 17px; transition: transform .12s; }
button:active { transform: scale(.98); }
button:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }
.error { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--peligro-suave); color: var(--peligro); }
.error[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Life OS</h1>
  <div class="red" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p>Compras, tareas, rutas, horario y clase</p>
  <form method="POST" action="/login">
    <div class="error" id="error" role="alert" hidden></div>
    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
  const e = new URLSearchParams(location.search).get('e');
  if (e) {
    const box = document.getElementById('error');
    box.textContent = e === 'bloqueado' ? 'Demasiados intentos. Espera 15 minutos.' : 'Contraseña incorrecta.';
    box.hidden = false;
  }
</script>
</body>
</html>
