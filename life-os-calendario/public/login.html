<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS · Entrar</title>
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#F4F3EF; --surface:#FFFFFF; --line:#E3E0D8; --text:#1C1B19; --muted:#77726A;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#E1EDE5; --red:#C24A2C; --red-soft:#F8E4DD; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#121211; --surface:#1C1B19; --line:#302E2A; --text:#F1EFE9; --muted:#A29D93;
    --accent:#74C49A; --accent-ink:#0E1A13; --accent-soft:#1F3328; --red:#EE8A6E; --red-soft:#3A221B; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--bg); color: var(--text); font: 15px/1.4 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 360px; text-align: center; }
.logo { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: 0 8px 24px rgba(47,107,79,.3); }
h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
p { margin: 6px 0 28px; color: var(--muted); }
input { width: 100%; height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit; font-size: 16px; outline: 0; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
button { width: 100%; height: 52px; margin-top: 12px; border: 0; border-radius: 14px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; }
button:active { transform: scale(.98); }
.error { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--red-soft); color: var(--red); font-size: 14px; }
.error[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
  <h1>Life OS</h1>
  <p>Compras, tareas, rutas, horario y clase</p>
  <form method="POST" action="/login">
    <div class="error" id="error" hidden></div>
    <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" autofocus required>
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
  const e = new URLSearchParams(location.search).get('e');
  if (e) {
    const box = document.getElementById('error');
    box.textContent = e === 'bloqueado' ? 'Demasiados intentos. Espera 15 minutos.' : 'Contraseña incorrecta.';
    box.hidden = false;
  }
</script>
</body>
</html>
