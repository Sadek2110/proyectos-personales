<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS</title>
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg: #F4F3EF; --surface: #FFFFFF; --surface-2: #ECEAE4; --line: #E3E0D8;
  --text: #1C1B19; --muted: #77726A; --faint: #A8A39A;
  --accent: #2F6B4F; --accent-ink: #FFFFFF; --accent-soft: #E1EDE5;
  --blue: #3D63A8; --blue-soft: #E3EAF6;
  --red: #C24A2C; --red-soft: #F8E4DD;
  --amber: #A86E14; --amber-soft: #F5EBD6;
  --plum: #8A3F86;
  --shadow: 0 1px 2px rgba(28,27,25,.06), 0 4px 16px rgba(28,27,25,.06);
  --radius: 16px;
  --tabbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --surface: #1C1B19; --surface-2: #272622; --line: #302E2A;
    --text: #F1EFE9; --muted: #A29D93; --faint: #6E6A62;
    --accent: #74C49A; --accent-ink: #0E1A13; --accent-soft: #1F3328;
    --blue: #86A8E8; --blue-soft: #1E2738;
    --red: #EE8A6E; --red-soft: #3A221B;
    --amber: #E2B15C; --amber-soft: #352A17;
    --plum: #D692D2;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }

.app { display: flex; flex-direction: column; height: 100dvh; max-width: 640px; margin: 0 auto; position: relative; }

/* ---------- Cabecera ---------- */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 18px) 20px 12px; }
.top h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:active { background: var(--surface-2); }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.demo { font-size: 11px; font-weight: 600; color: var(--amber); background: var(--amber-soft); padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }

/* ---------- Contenido ---------- */
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(var(--tabbar-h) + 96px); }
main.full { padding: 0; overflow: hidden; }
.view[hidden] { display: none; }

.segmented { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; margin: 4px 0 16px; }
.segmented button { flex: 1; padding: 8px 10px; border-radius: 9px; font-weight: 500; font-size: 14px; color: var(--muted); }
.segmented button b { font-weight: 600; margin-left: 4px; }
.segmented button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.group { margin-bottom: 18px; }
.group-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px; }
.group-head .name { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.group-head .name.danger { color: var(--red); }
.group-head .sub { font-size: 12px; color: var(--faint); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px;
  transition: opacity .2s, transform .2s; }
.row + .row { border-top: 1px solid var(--line); }
.row.leaving { opacity: 0; transform: translateX(24px); }
.pending { opacity: .55; pointer-events: none; }
.row-main { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.done .row-title { color: var(--faint); text-decoration: line-through; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.row-meta .m { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.row-meta .m span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
.row-meta .late { color: var(--red); font-weight: 500; }

.check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--faint);
  display: grid; place-items: center; color: transparent; transition: all .15s; }
.check:active { transform: scale(.9); }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check.prio-Alta { border-color: var(--red); }

.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.tag-Alta { color: var(--red); background: var(--red-soft); }
.tag-Media { color: var(--amber); background: var(--amber-soft); }
.tag-Baja { color: var(--muted); background: var(--surface-2); }

.pill { flex: none; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px; transition: all .15s; }
.pill-falta { color: var(--red); background: var(--red-soft); }
.pill-casa { color: var(--accent); background: var(--accent-soft); }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px;
  padding: 0 12px; margin-bottom: 16px; box-shadow: var(--shadow); color: var(--faint); }
.search input { flex: 1; border: 0; outline: 0; background: none; padding: 11px 0; font-size: 15px; }

.empty { text-align: center; padding: 56px 24px; color: var(--muted); }
.empty .ico { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); }
.empty h3 { margin: 0 0 4px; color: var(--text); font-size: 17px; }
.empty p { margin: 0; font-size: 14px; }

.skel { height: 56px; border-radius: 12px; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Horario ---------- */
.days { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 16px; padding: 4px 16px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 52px; padding: 8px 0 10px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day .dw { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.day .dn { font-size: 18px; font-weight: 600; }
.day .dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day .dot.has { background: var(--accent); }
.day.on { background: var(--accent); color: var(--accent-ink); }
.day.on .dw { color: inherit; opacity: .8; }
.day.on .dot.has { background: var(--accent-ink); }
.day-title { font-size: 17px; font-weight: 600; margin: 0 4px 10px; }
.allday { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.allday button { background: var(--accent-soft); color: var(--accent); font-weight: 500; font-size: 13px; padding: 6px 12px; border-radius: 10px; }
.ev { display: flex; gap: 14px; padding: 12px 14px; text-align: left; width: 100%; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev-time { flex: none; width: 48px; font-size: 13px; font-variant-numeric: tabular-nums; }
.ev-time b { display: block; font-weight: 600; }
.ev-time span { color: var(--faint); }
.ev-body { flex: 1; min-width: 0; border-left: 3px solid var(--accent); padding-left: 12px; }
.ev-body.now { border-color: var(--red); }
.ev-title { font-weight: 500; }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 500; font-size: 14px; text-decoration: none; padding: 8px 4px; }

/* ---------- Calendario: barra de navegación ---------- */
main.cal { padding: 0; overflow: hidden; }
main.cal > #v-horario { height: 100%; display: flex; flex-direction: column; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
.cal-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
main.cal .cal-bar { padding: 0 12px; margin-bottom: 8px; }
.cal-nav { display: flex; align-items: center; gap: 2px; flex: 1 1 100%; min-width: 0; }
.cal-hoy { flex: none; height: 36px; padding: 0 12px; margin-right: 4px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-weight: 600; }
.cal-nav .icon-btn { flex: none; width: 36px; height: 36px; color: var(--text); }
.cal-tit { min-width: 0; margin: 0 0 0 6px; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-spin { flex: none; color: var(--muted); margin-left: 6px; }
.cal-vistas { flex: 1 1 100%; }
.cal-vistas button { flex: 1; }

/* Tiras de evento (comunes a Mes y a la franja de todo el día) */
.ct { min-width: 0; height: 18px; padding: 0 4px; display: flex; align-items: center; gap: 4px; border-radius: 4px; overflow: hidden;
  font-size: 11px; line-height: 18px; font-weight: 500; text-align: left; white-space: nowrap; pointer-events: auto;
  background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
.ct span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ct-hora, .ct i { display: none; flex: none; }
.ct-barra { background: color-mix(in srgb, var(--c) 34%, var(--surface)); font-weight: 600; }
.ct-barra.corte-i { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.ct-barra.corte-d { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.ct-tarea { background: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
.ct-mas { min-width: 0; height: 18px; padding: 0 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; white-space: nowrap; pointer-events: auto; }

/* Vista Mes */
.cm { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-block: 1px solid var(--line); }
.cm-cab { flex: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.cm-cab span { padding: 5px 0; text-align: center; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); }
.cm-filas { flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(70px, 1fr); overflow-y: auto; }
.cm-sem { position: relative; min-height: 0; overflow: hidden; }
.cm-sem + .cm-sem { border-top: 1px solid var(--line); }
.cm-fondo { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cm-dia { min-width: 0; padding-top: 2px; display: flex; justify-content: center; align-items: flex-start; cursor: pointer; }
.cm-dia + .cm-dia { border-left: 1px solid var(--line); }
.cm-dia.finde { background: color-mix(in srgb, var(--surface-2) 40%, transparent); }
.cm-num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cm-dia.fuera .cm-num { color: var(--faint); }
.cm-dia.hoy .cm-num { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.cm-tiras { position: absolute; top: 26px; left: 0; right: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 18px; row-gap: 2px; padding-inline: 1px; column-gap: 2px; pointer-events: none; }

/* Vistas Semana y Día */
.cs { --gutter: 44px; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-block: 1px solid var(--line); }
.cs-cab, .cs-todo { flex: none; display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); overflow-y: hidden; scrollbar-gutter: stable; border-bottom: 1px solid var(--line); }
.cs-dias { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.cs-dh { min-width: 0; padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.cs-dh span { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); }
.cs-dh b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cs-dh.hoy span { color: var(--accent); }
.cs-dh.hoy b { background: var(--accent); color: var(--accent-ink); }
.cs-tl { font-size: 10px; color: var(--faint); text-align: right; padding: 5px 6px 0 0; }
.cs-tiras { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-auto-rows: 18px; row-gap: 2px; column-gap: 2px; padding: 3px 1px; }
.cg-cuerpo { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-gutter: stable; }
.cs-grid { position: relative; display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); height: calc(24 * var(--hora)); }
.cs-horas { position: relative; }
.cs-hl { position: absolute; right: 6px; transform: translateY(-50%); font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.cs-cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.cs-col { position: relative; min-width: 0; cursor: pointer; border-left: 1px solid var(--line);
  background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% var(--hora); }
.cs-col.hoy { background-color: color-mix(in srgb, var(--accent-soft) 35%, transparent); }
.ce { position: absolute; min-width: 0; padding: 2px 2px 2px 3px; overflow: hidden; border-radius: 4px; text-align: left; font-size: 10.5px; line-height: 1.2;
  background: color-mix(in srgb, var(--c) 24%, var(--surface)); border-left: 2px solid var(--c); box-shadow: 0 0 0 1px var(--surface); }
.ce b { display: block; font-weight: 600; overflow: hidden; overflow-wrap: anywhere; }
.cs-7 .ce span { display: none; }
.ce span { display: block; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ce-corto b { white-space: nowrap; }
.cs-ahora { position: absolute; left: 0; right: 0; z-index: 2; height: 2px; background: var(--red); pointer-events: none; }
.cs-ahora::before { content: ''; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); }

/* ---------- Mapa ---------- */
#v-mapa { position: relative; height: 100%; }
#map { position: absolute; inset: 0 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom)) 0; background: var(--surface-2); }
@media (prefers-color-scheme: dark) {
  #map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(.45) brightness(.9) contrast(.9); }
}
.map-top { position: absolute; z-index: 500; top: 4px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.layer { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); box-shadow: var(--shadow);
  padding: 8px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; }
.layer i { width: 10px; height: 10px; border-radius: 50%; }
.layer.off { opacity: .5; }
.layer.off i { background: var(--faint) !important; }
.map-bottom { position: absolute; z-index: 500; left: 12px; right: 12px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);
  display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.map-note { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface); padding: 4px 10px; border-radius: 99px; box-shadow: var(--shadow); }
.pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: grid; place-items: center;
  border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.pin b { transform: rotate(45deg); color: #fff; font: 600 12px Inter, sans-serif; }
.pin-t { background: var(--blue); } .pin-s { background: var(--accent); }
.leaflet-popup-content-wrapper { border-radius: 14px; background: var(--surface); color: var(--text); }
.leaflet-popup-tip { background: var(--surface); }
.leaflet-popup-content { margin: 12px 14px; font: 14px/1.4 Inter, sans-serif; }
.leaflet-popup-content h4 { margin: 0 0 4px; font-size: 14px; }
.leaflet-popup-content ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.leaflet-container a.leaflet-popup-close-button { color: var(--faint); }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 18px;
  border-radius: 14px; font-weight: 600; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn:active { transform: scale(.98); }
.btn[disabled], .btn.disabled { opacity: .45; pointer-events: none; }

.fab { position: absolute; right: 18px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px); z-index: 600;
  width: 58px; height: 58px; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: 0 6px 20px rgba(47,107,79,.35); transition: transform .15s; }
.fab:active { transform: scale(.94); }
.fab[hidden] { display: none; }
.fab.on-map { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 100px); }
.map-hint { position: absolute; z-index: 450; left: 50%; top: 45%; transform: translate(-50%, -50%); width: min(300px, calc(100% - 48px));
  text-align: center; background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); pointer-events: none; }
.map-hint b { display: block; margin-bottom: 4px; }
.map-hint span { color: var(--muted); font-size: 14px; }
.leaflet-popup-content .btn { height: 38px; margin-top: 10px; width: 100%; font-size: 14px; }
.cal-name { font-size: 12px; color: var(--faint); }

/* ---------- Rutas guardadas ---------- */
.mapseg { display: inline-flex; background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 3px; }
.mapseg button { padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; color: var(--muted); }
.mapseg button.on { background: var(--accent); color: var(--accent-ink); }
.mapseg b { font-weight: 600; margin-left: 2px; }
.rpanel { position: absolute; z-index: 550; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  max-height: 58%; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 16px 16px 20px;
  box-shadow: 0 -6px 24px rgba(0,0,0,.12); }
.rpanel[hidden] { display: none; }
.rpanel.detalle { max-height: 52%; }
.rp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.rp-head h3 { margin: 0; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.rp-head > div:first-child { flex: 1; min-width: 0; }
.btn-sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; flex: none; }
.ruta-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; }
.ruta-item + .ruta-item { border-top: 1px solid var(--line); }
.ri-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ri-dur { flex: none; text-align: right; display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.ri-dur b { font-size: 15px; color: var(--text); }
.line { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 6px; line-height: 1.3; }
.sep { color: var(--faint); }
.opts { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px; scrollbar-width: none; }
.opts::-webkit-scrollbar { display: none; }
.opt { flex: none; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 10px 12px; border-radius: 14px;
  background: var(--surface); border: 2px solid transparent; box-shadow: var(--shadow); }
.opt.on { border-color: var(--accent); }
.rsum { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 2px 12px; }
.rsum b { font-size: 24px; letter-spacing: -.02em; }
.rsum span { color: var(--muted); font-size: 14px; }
.steps { list-style: none; margin: 0 0 12px; padding: 14px 14px 6px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.st { position: relative; display: flex; gap: 12px; padding-bottom: 16px; font-size: 14px; }
.st::before { content: ''; position: absolute; left: 13px; top: 28px; bottom: 0; border-left: 3px dotted var(--faint); }
.st:last-child::before { display: none; }
.st-transit::before { border-left: 4px solid var(--lc); left: 12px; }
.st-car::before { border-left-style: solid; border-color: var(--accent); }
.st .dot { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
  background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 13px; position: relative; z-index: 1; }
.st-transit .dot { background: var(--lc); color: #fff; }
.st .dot.a { background: var(--accent); color: var(--accent-ink); }
.st .dot.b { background: var(--blue); color: #fff; }
.st > div { flex: 1; min-width: 0; padding-top: 4px; }
.st .dir { color: var(--muted); font-size: 13px; }
.st .stop { margin-top: 6px; }
.st .stop b:first-child { display: inline-block; min-width: 44px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 13px; margin-top: 2px; }
.small { font-size: 12px; margin: 0 2px 12px; }
.aviso { font-size: 13px; color: var(--amber); background: var(--amber-soft); padding: 10px 12px; border-radius: 12px; margin: 0 0 12px; }
.rp-actions { display: flex; gap: 10px; }
.rp-actions .btn { flex: 1; height: 44px; font-size: 14px; }

/* ---------- Barra inferior ---------- */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 700; display: flex;
  padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px); height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 500; color: var(--faint); position: relative; border-radius: 12px; }
.tab.on { color: var(--accent); }
.tab .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 99px; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }

/* ---------- Hoja inferior (formularios) ---------- */
.backdrop { position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; max-height: 92dvh; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 20px calc(env(safe-area-inset-bottom) + 20px);
  transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.backdrop.open .sheet { transform: none; }
.grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.field select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
.field input, .field select { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
  background-color: var(--bg); outline: 0; font-size: 16px; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field small { display: block; color: var(--faint); font-size: 12px; margin-top: 4px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; padding: 9px 16px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-weight: 500; }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet-actions .btn-primary { flex: 1; }
.detail { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; color: var(--muted); }
.detail svg { flex: none; margin-top: 1px; }

/* ---------- Aviso ---------- */
.toast { position: fixed; z-index: 1000; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: all .2s;
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); width: max-content;
  background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 14px; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--accent-soft); font-weight: 600; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .toast button { color: #2F6B4F; } }

/* ---------- Clase: cada módulo es un bloque con su color y su línea de unidades ---------- */
.cl-intro { display: grid; gap: 10px; margin: 4px 0 14px; }
.cl-bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.cl-bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.cl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.cl-tools input { flex: 1 1 200px; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.cl-ocultar { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: var(--muted); }
.cl-res { display: grid; }
.cl-res:empty { display: none; }
.cl-res button { width: 100%; text-align: left; padding: 10px 14px; overflow-wrap: anywhere; }
.cl-res button + button { border-top: 1px solid var(--line); }
.cl-res small { color: var(--muted); }
.cl-res p { margin: 0; padding: 12px 14px; color: var(--muted); }

.cl-nav { position: sticky; top: 0; z-index: 20; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px 18px; padding: 6px 16px; background: var(--bg); border-block: 1px solid var(--line); }
.cl-nav button { flex: 1 0 auto; min-height: 38px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.cl-nav i { width: 9px; height: 9px; border-radius: 50%; background: var(--cl, var(--text)); }
.cl-nav button.on { background: var(--cl, var(--text)); color: var(--accent-ink); }
.cl-nav button.on:not([style]) { color: var(--bg); }
.cl-nav button.on i { background: currentColor; }

.cl-fechas { margin-bottom: 22px; scroll-margin-top: 58px; }
.cl-fecha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; padding: 11px 14px; min-height: 56px; }
.cl-fecha + .cl-fecha { border-top: 1px solid var(--line); }
.cl-fecha .cuando { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cl-fecha b { grid-column: 1 / -1; font-weight: 500; overflow-wrap: anywhere; }
.cl-fecha small { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }

.cl-mod { --cl: var(--accent); margin-bottom: 22px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); scroll-margin-top: 58px;
  background: var(--surface); background: color-mix(in srgb, var(--cl) 9%, var(--surface)); }
.cl-head { display: grid; gap: 6px; padding: 16px; background: var(--cl); color: var(--accent-ink); }
.cl-head-top { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.cl-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.cl-head p { margin: 0; font-size: 13.5px; }
.cl-num { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cl-mbar { height: 5px; border-radius: 99px; background: rgba(127,127,127,.4); overflow: hidden; }
.cl-mbar i { display: block; height: 100%; background: var(--accent-ink); transition: width .2s; }
.cl-aula { justify-self: start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; margin-top: 2px;
  border: 1px solid currentColor; border-radius: 10px; font-size: 13px; font-weight: 600; color: inherit; text-decoration: none; }

.cl-line { display: grid; grid-template-columns: minmax(0, 1fr); padding: 6px 12px 12px; }
.cl-st { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 1px; align-items: center; justify-items: start;
  width: 100%; min-height: 56px; padding: 12px 10px 12px 0; text-align: left; border-radius: 12px; }
.cl-st > * { grid-column: 2; }
.cl-st::before { content: ""; position: absolute; top: 0; bottom: 0; left: 10px; border-left: 4px solid var(--cl); }
.cl-st.primera::before { top: 24px; }
.cl-st.ultima::before { bottom: calc(100% - 24px); }
.cl-st.vacia::before { border-left-style: dashed; opacity: .7; }
.cl-st[aria-expanded="true"] { background: var(--surface); border-radius: 12px 12px 0 0; }
.cl-st:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
.cl-dot { grid-column: 1; grid-row: 1 / span 4; align-self: start; position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%;
  border: 4px solid var(--cl); background: var(--surface); display: grid; place-items: center; color: var(--accent-ink); }
.cl-st.vacia .cl-dot { border-style: dashed; }
.cl-st.llena .cl-dot { background: var(--cl); }
.cl-code { font-size: 12px; color: var(--muted); }
.cl-name { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.cl-info { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cl-ahora { margin-top: 3px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--cl); color: var(--accent-ink); }
.cl-chev { grid-column: 3; grid-row: 1 / span 4; color: var(--muted); }
.cl-st[aria-expanded="true"] .cl-chev { transform: rotate(90deg); }
.cl-st:not([aria-expanded="true"]) .cl-chev { transform: rotate(-90deg); }

.cl-panel { display: grid; gap: 14px; min-width: 0; padding: 14px; margin-bottom: 8px; background: var(--surface); border-radius: 0 0 12px 12px; }
.cl-panel h3 { margin: 0; font-size: 17px; font-weight: 700; }
.cl-panel > p { margin: 0; color: var(--muted); }
.cl-phead { display: grid; gap: 3px; }
.cl-eyebrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.cl-group { display: grid; gap: 2px; }
.cl-group.act { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--cl) 10%, var(--surface)); }
.cl-group h4 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.cl-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; min-height: 52px; padding: 9px 0; }
.cl-item + .cl-item { border-top: 1px solid var(--line); }
.cl-item .check { border-color: var(--cl); }
.cl-item .check.on { background: var(--cl); border-color: var(--cl); }
.cl-body { min-width: 0; display: grid; gap: 2px; text-align: left; }
.cl-tipo { display: inline-block; margin-right: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 11px; font-weight: 500; color: var(--muted); }
.cl-nombre { font-weight: 500; overflow-wrap: anywhere; }
.cl-item.hecho .cl-nombre { color: var(--faint); text-decoration: line-through; }
.cl-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.cl-meta.alerta { color: var(--red); font-weight: 500; }
.cl-enlaces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.cl-enlaces button { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--muted); }
.cl-enlaces button.on { border-color: var(--cl); color: var(--text); }
.cl-abrir { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid var(--cl); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none; white-space: nowrap; }
.cl-pnav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); }
.cl-pnav button { min-height: 40px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; font-weight: 500; text-align: left; }
.cl-pnav .sig { margin-left: auto; }
.cl-pie { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 4px 4px 12px; font-size: 13px; color: var(--muted); }
.cl-pie button { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; }
@media (max-width: 460px) {
  .cl-item { grid-template-columns: 26px minmax(0, 1fr); }
  .cl-abrir { grid-column: 2; justify-self: start; }
  .cl-pnav button { flex: 1 1 100%; }
  .cl-pnav .sig { margin-left: 0; }
}
/* Con ancho de sobra, la línea pasa a horizontal y el material se abre debajo de todas las unidades */
@media (min-width: 1100px) {
  .cl-nav { margin-inline: 0; }
  .cl-line { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); padding: 6px 14px 14px; }
  .cl-st { grid-column: var(--i); grid-row: 1; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: start; align-items: start;
    text-align: center; padding: 12px 6px; row-gap: 3px; }
  .cl-st > * { grid-column: 1; }
  .cl-dot { grid-column: 1; grid-row: auto; align-self: auto; }
  .cl-chev { display: none; }
  .cl-st::before { top: 22px; bottom: auto; left: 0; right: 0; border-left: 0; border-top: 4px solid var(--cl); }
  .cl-st.primera::before { top: 22px; left: 50%; }
  .cl-st.ultima::before { bottom: auto; right: 50%; }
  .cl-st.vacia::before { border-left-style: none; border-top-style: dashed; }
  .cl-st:hover { background: color-mix(in srgb, var(--cl) 12%, transparent); }
  .cl-st[aria-expanded="true"]:hover { background: var(--surface); }
  .cl-panel { grid-column: 1 / -1; grid-row: 2; margin: 0; padding: 18px; border-radius: 12px; }
  .cl-panel.p-ini { border-top-left-radius: 0; }
  .cl-panel.p-fin { border-top-right-radius: 0; }
  .cl-fecha { grid-template-columns: 150px 92px minmax(0, 1fr); }
  .cl-fecha b, .cl-fecha small { grid-column: 3; }
  .cl-fecha .cuando { grid-row: 1 / span 2; }
  .cl-fecha .tag { grid-row: 1 / span 2; justify-self: start; }
}

/* ---------- Solo escritorio: marca y cerrar sesión ocultos en móvil ---------- */
.brand, .tab-salir { display: none; }

/* ---------- Escritorio (PC / tablet horizontal) ---------- */
@media (min-width: 900px) {
  :root { --side-w: 240px; }
  .app { max-width: none; display: grid; grid-template-columns: var(--side-w) 1fr; grid-template-rows: auto 1fr; }
  .tabbar { position: relative; grid-column: 1; grid-row: 1 / 3; height: auto; flex-direction: column; gap: 2px;
    padding: 24px 14px; background: var(--surface); backdrop-filter: none; border-top: 0; border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; padding: 0 10px 22px; }
  .brand-logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .tab { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 11px 12px; font-size: 15px; color: var(--muted); }
  .tab:hover { background: var(--surface-2); }
  .tab.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tab .badge { position: static; margin-left: auto; }
  .tab-salir { display: flex; margin-top: auto; }
  .top, main { grid-column: 2; }
  .top { padding: 32px 48px 16px; width: 100%; max-width: calc(820px + 96px); }
  main > .view:not(#v-mapa) { max-width: 820px; }
  main { padding: 0 48px 120px; }
  main.full { padding: 0; }
  .app:has(main.cal) .top { max-width: none; padding-inline: 24px; }
  main.cal { padding: 0 24px; }
  main.cal > #v-horario { max-width: none; padding-bottom: 20px; }
  main.cal .cal-bar { padding: 0; }
  .cal-nav { flex: 1 1 auto; width: auto; }
  .cal-vistas { flex: none; width: 320px; }
  .cal-tit { font-size: 20px; }
  .cm, .cs { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .cs { --gutter: 56px; }
  .ct, .ct-mas { height: 20px; font-size: 12px; line-height: 20px; }
  .cm-tiras, .cs-tiras { grid-auto-rows: 20px; }
  .ct:not(.ct-barra):not(.ct-tarea) { background: none; }
  .ct:hover, .ct-mas:hover { background-color: color-mix(in srgb, var(--c, var(--text)) 14%, var(--surface)); }
  .ct-hora { display: inline; color: var(--muted); }
  .ct i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .ct-tarea i { background: none; box-shadow: inset 0 0 0 1.5px var(--c); }
  .ce { padding: 2px 4px 2px 6px; border-left-width: 3px; font-size: 12px; line-height: 1.25; }
  .cs-7 .ce span { display: block; }
  .cm-dia:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  .cs-col:hover { background-color: color-mix(in srgb, var(--surface-2) 25%, transparent); }
  #map { inset: 0; }
  .map-top { top: 12px; left: 24px; right: auto; }
  .map-bottom { left: auto; right: 24px; bottom: 24px; width: 320px; }
  .rpanel, .rpanel.detalle { left: 24px; right: auto; top: 64px; bottom: 24px; width: 400px; max-height: none;
    border-radius: 20px; box-shadow: var(--shadow); }
  .fab { position: fixed; right: 48px; bottom: 40px; }
  .fab.on-map { right: 40px; bottom: 100px; }
  .toast { bottom: 32px; left: calc(50% + var(--side-w) / 2); }
  .row:hover, .ev:hover { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
  .backdrop { display: grid; place-items: center; }
  .sheet { position: relative; width: calc(100% - 48px); max-width: 480px; max-height: 86vh; border-radius: 22px;
    padding: 16px 24px 24px; transform: translateY(12px) scale(.98); opacity: 0; transition: transform .2s, opacity .2s; }
  .backdrop.open .sheet { opacity: 1; }
  .grip { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="titulo">Compras</h1>
      <p id="subtitulo">&nbsp;</p>
    </div>
    <button class="icon-btn" id="btn-refresh" data-act="refrescar" aria-label="Actualizar"></button>
  </header>

  <main id="main">
    <section class="view" id="v-compras"></section>
    <section class="view" id="v-tareas" hidden></section>
    <section class="view" id="v-mapa" hidden>
      <div id="map"></div>
      <div class="map-top" id="map-top"></div>
      <div class="map-bottom" id="map-bottom"></div>
      <div class="rpanel" id="rpanel" hidden></div>
    </section>
    <section class="view" id="v-horario" hidden></section>
    <section class="view" id="v-clase" hidden></section>
  </main>

  <button class="fab" id="fab" data-act="nuevo" aria-label="Añadir"></button>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="backdrop" id="backdrop" data-act="fondoSheet"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================== Iconos */
const I = (d, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  cart: s => I('<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3h2.6l2.4 12.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6"/>', s),
  tasks: s => I('<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>', s),
  map: s => I('<path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>', s),
  cal: s => I('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>', s),

/* =========================================================== Utilidades */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoDia = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => isoDia(new Date());
const sumarDias = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoDia(new Date(y, m - 1, d + n)); };
const aFecha = s => { const [f, h = '00:00'] = s.split('T'); const [y, m, d] = f.split('-').map(Number); const [hh, mm] = h.split(':').map(Number); return new Date(y, m - 1, d, hh, mm); };
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const msg = e => (e && e.message) || String(e);
const unicos = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));

function nombreDia(iso, largo) {
  const h = hoy();
  if (iso === h) return 'Hoy';
  if (iso === sumarDias(h, 1)) return 'Mañana';
  if (iso === sumarDias(h, -1)) return 'Ayer';
  const d = aFecha(iso);
  return largo ? `${cap(DIAS[d.getDay()])} ${d.getDate()} de ${MESES[d.getMonth()]}`
               : `${DIAS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`;
}
function fechaCorta(s) {
  if (!s) return '';
  const hora = s.slice(11, 16);
  return nombreDia(s.slice(0, 10)) + (hora && hora !== '00:00' ? ' · ' + hora : '');
}
function agrupar(lista, clave, orden) {
  const m = new Map();
  lista.forEach(x => { const k = clave(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  const grupos = [...m.entries()];
  return orden ? grupos.sort((a, b) => orden.indexOf(a[0]) - orden.indexOf(b[0])) : grupos.sort((a, b) => a[0].localeCompare(b[0], 'es'));
}
function lsGet(k) { try { return localStorage.getItem('lifeos:' + k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem('lifeos:' + k, v); } catch (e) {} }

/* =========================================================== Servidor */
const MODO_DEMO = location.protocol === 'file:';   // abrir el archivo suelto = datos de ejemplo
async function api(fn, ...args) {
  if (MODO_DEMO) return MOCK[fn](...args);
  let r;
  try {
    r = await fetch('/api/' + fn, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ args }),
    });
  } catch (e) { throw new Error('Sin conexión'); }
  if (r.status === 401) { location.href = '/login.html'; throw new Error('Sesión caducada'); }
  const cuerpo = await r.json().catch(() => ({ ok: false, error: 'Respuesta no válida del servidor' }));
  if (!cuerpo.ok) throw new Error(cuerpo.error || 'Error del servidor');
  return cuerpo.data;
}

/* =========================================================== Carga */
async function cargar() {
  S.cargando = true; pintarRefresh();
  S.cal.gen++;
  const [visIni, visFin] = rangoVisibleCal();
  const rango = { desde: minIso(visIni, hoy()), hasta: maxIso(visFin, sumarDias(hoy(), 21)) };
  const [datos, eventos, cals, rutas, clase] = await Promise.allSettled([
    api('obtenerDatos'), pedirEventos(rango.desde, rango.hasta), api('obtenerCalendarios'), api('obtenerRutas'), api('obtenerClase')]);
  aplicarProgresoClase(clase);
  if (cals.status === 'fulfilled') S.calendarios = cals.value;
  if (rutas.status === 'fulfilled') S.rutas = rutas.value;
  if (datos.status === 'fulfilled') { S.compras = datos.value.compras; S.tareas = datos.value.tareas; }
  else toast('No se pudieron cargar los datos: ' + msg(datos.reason));
  if (eventos.status === 'fulfilled') { S.eventos = eventos.value; S.cal.rango = rango; S.cal.errorEn = 0; }
  else { S.cal.errorEn = Date.now(); toast('No se pudo leer el calendario: ' + msg(eventos.reason)); }
  S.cargando = false; S.cargadoEn = Date.now();
  render();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - S.cargadoEn > 60e3) cargar();
});

function subtitulo() {
  if (S.cargando && !S.cargadoEn) return 'Cargando…';

      if (!falta.length) return 'Todo en casa';
      const tiendas = unicos(falta.map(p => p.tienda)).length;

    case 'tareas': return pend.length ? `${pend.length} pendientes` + (venc ? ` · ${venc} vencidas` : '') : 'Nada pendiente';

/* ---------- Tareas ---------- */
const BUCKETS = ['Vencidas', 'Hoy', 'Mañana', 'Próximos 7 días', 'Más adelante', 'Sin fecha'];
function bucket(t) {
  if (!t.fecha) return 'Sin fecha';
  const d = t.fecha.slice(0, 10), h = hoy();
  if (d < h) return 'Vencidas';
  if (d === h) return 'Hoy';
  if (d === sumarDias(h, 1)) return 'Mañana';
  if (d <= sumarDias(h, 7)) return 'Próximos 7 días';
  return 'Más adelante';
}
function ordenTareas(a, b) {
  if (!!a.fecha !== !!b.fecha) return a.fecha ? -1 : 1;
  if (a.fecha !== b.fecha) return a.fecha < b.fecha ? -1 : 1;
  return PRIORIDADES.indexOf(a.prioridad) - PRIORIDADES.indexOf(b.prioridad);
}
function vistaTareas() {
  if (S.cargando && !S.cargadoEn) return esqueleto();
  const pend = S.tareas.filter(t => !t.completada).sort(ordenTareas);
  const hechas = S.tareas.filter(t => t.completada).sort((a, b) => ordenTareas(b, a));
  let html = segmented('modoTareas', [['pend', `Pendientes<b>${pend.length}</b>`], ['hechas', `Hechas<b>${hechas.length}</b>`]]);
  if (S.modoTareas === 'pend') {
    if (!pend.length) return html + vacio('check', 'Todo hecho', 'No tienes tareas pendientes. Toca + para añadir una.');
    return html + agrupar(pend, bucket, BUCKETS).map(([b, items]) => `
      <div class="group">
        <div class="group-head"><span class="name ${b === 'Vencidas' ? 'danger' : ''}">${b}</span><span class="sub">${items.length}</span></div>
        <div class="card">${items.map(filaTarea).join('')}</div>
      </div>`).join('');
  }
  if (!hechas.length) return html + vacio('tasks', 'Aún nada', 'Las tareas que completes aparecerán aquí.');
  return html + `<div class="card">${hechas.map(filaTarea).join('')}</div>`;
}
function filaTarea(t) {
  const late = !t.completada && t.fecha && t.fecha.slice(0, 10) < hoy();
  return `<div class="row ${t.completada ? 'done' : ''} ${tmp(t.id) ? 'pending' : ''}" data-row="${esc(t.id)}">
    <button class="check ${t.completada ? 'on' : 'prio-' + esc(t.prioridad)}" data-act="toggleTarea" data-id="${esc(t.id)}" aria-label="Completar">${ICON.check(16)}</button>
    <button class="row-main" data-act="editarTarea" data-id="${esc(t.id)}">
      <span class="row-title">${esc(t.titulo)}</span>
      <span class="row-meta">
        ${t.prioridad && !t.completada ? `<span class="tag tag-${esc(t.prioridad)}">${esc(t.prioridad)}</span>` : ''}
        ${t.fecha ? `<span class="m ${late ? 'late' : ''}">${ICON.clock(14)}<span>${esc(fechaCorta(t.fecha))}</span></span>` : ''}
        ${t.ubicacion ? `<span class="m">${ICON.pin(14)}<span>${esc(t.ubicacion)}</span></span>` : ''}
      </span>
    </button>
  </div>`;
}

/* ---------- Calendario: rejilla de Mes, Semana y Día ---------- */
const HORA_PX = 48;
const CM_ARRIBA = 26;   // alto reservado para el número del día en cada semana del Mes
const minIso = (a, b) => a < b ? a : b;
const maxIso = (a, b) => a > b ? a : b;
const difDias = (a, b) => Math.round((aFecha(b) - aFecha(a)) / 864e5);
const inicioSemana = iso => sumarDias(iso, -((aFecha(iso).getDay() + 6) % 7));
const diasDesde = (ini, n) => Array.from({ length: n }, (_, i) => sumarDias(ini, i));
const minutosDe = s => +s.slice(11, 13) * 60 + +s.slice(14, 16);
const mesCorto = d => MESES[d.getMonth()].slice(0, 3);
const topAhora = d => (d.getHours() * 60 + d.getMinutes()) / 60 * HORA_PX;
// Un día de más cubre el último día completo cuando hay cambio de hora en el rango.
const pedirEventos = (desde, hasta) => api('obtenerEventos', desde, difDias(desde, hasta) + 2);

function rangoVisibleCal() {
  if (S.vistaCal === 'mes') {
    const [y, m] = S.dia.split('-').map(Number);
    return [inicioSemana(`${y}-${pad(m)}-01`), sumarDias(inicioSemana(isoDia(new Date(y, m, 0))), 6)];
  }
  if (S.vistaCal === 'semana') { const ini = inicioSemana(S.dia); return [ini, sumarDias(ini, 6)]; }
  if (S.vistaCal === 'dia') return [S.dia, S.dia];
  return [minIso(S.dia, hoy()), maxIso(S.dia, sumarDias(hoy(), 13))];
}
function visibleDescargado() {
  const [ini, fin] = rangoVisibleCal(), r = S.cal.rango;
  return !!r && r.desde <= ini && fin <= r.hasta;
}

/** Descarga lo que falta alrededor de lo visible, para que pasar de mes sea inmediato. */
async function asegurarRangoCal() {
  if (S.tab !== 'horario' || S.cargando || S.cal.cargando || Date.now() - S.cal.errorEn < 30e3) return;
  const [ini, fin] = rangoVisibleCal();
  const desde = sumarDias(ini, -35), hasta = sumarDias(fin, 35), r = S.cal.rango;
  const tramos = !r ? [[desde, hasta]] : [
    ...(desde < r.desde ? [[desde, sumarDias(r.desde, -1)]] : []),
    ...(hasta > r.hasta ? [[sumarDias(r.hasta, 1), hasta]] : []),
  ];
  if (!tramos.length) return;
  const gen = S.cal.gen;
  S.cal.cargando = true;
  const spin = $('#cal-spin');
  if (spin) spin.hidden = visibleDescargado();
  try {
    const partes = await Promise.all(tramos.map(([a, b]) => pedirEventos(a, b)));
    if (gen === S.cal.gen) {
      // Un evento que cruza el borde llega en ambos tramos; los repetidos comparten id, no inicio.
      const clave = e => `${e.id}|${e.inicio}`;
      const vistos = new Set(S.eventos.map(clave));
      partes.flat().forEach(e => { if (!vistos.has(clave(e))) { vistos.add(clave(e)); S.eventos.push(e); } });
      S.cal.rango = r ? { desde: minIso(desde, r.desde), hasta: maxIso(hasta, r.hasta) } : { desde, hasta };
    }
  } catch (e) {
    S.cal.errorEn = Date.now();
    toast('No se pudo leer el calendario: ' + msg(e));
  }
  S.cal.cargando = false;
  if (S.tab === 'horario') render();
}

function tituloCal() {
  const d = aFecha(S.dia);
  if (S.vistaCal === 'dia') return `${cap(DIAS[d.getDay()])} ${d.getDate()} ${mesCorto(d)} ${d.getFullYear()}`;
  if (S.vistaCal === 'semana') {
    const [a, b] = rangoVisibleCal().map(aFecha);
    if (a.getFullYear() !== b.getFullYear()) return `${a.getDate()} ${mesCorto(a)} ${a.getFullYear()} – ${b.getDate()} ${mesCorto(b)} ${b.getFullYear()}`;
    return `${a.getDate()}${a.getMonth() !== b.getMonth() ? ' ' + mesCorto(a) : ''} – ${b.getDate()} ${mesCorto(b)} ${b.getFullYear()}`;
  }
  return `${cap(MESES[d.getMonth()])} ${d.getFullYear()}`;
}

function pintarCalendario() {
  const v = $('#v-horario');

function vistaCalendario() {

/** Días que ocupa un evento. No se incluye el día final de uno de día completo ni el de uno que acaba a medianoche. */
function diasEvento(e) {
  const ini = e.inicio.slice(0, 10);
  let fin = e.fin.slice(0, 10);
  if (fin > ini && (e.diaCompleto || e.fin.slice(11, 16) === '00:00')) fin = sumarDias(fin, -1);
  return [ini, maxIso(ini, fin)];
}
function tirasCal() {
  const eventos = S.eventos.map(e => {
    const [ini, fin] = diasEvento(e);
    return { e, ini, fin, barra: e.diaCompleto || ini !== fin, orden: e.diaCompleto ? '' : e.inicio };
  });
  const tareas = S.tareas.filter(t => !t.completada && t.fecha).map(t => {
    const dia = t.fecha.slice(0, 10);
    return { t, ini: dia, fin: dia, barra: false, orden: t.fecha };
  });
  return [...eventos, ...tareas];
}

/**
 * Coloca las tiras de una fila de días en carriles sin solapes, como las barras de Google Calendar.
 * Si un día no da abasto, su último carril se reserva para el «+N más».
 */
function colocarCarriles(tiras, dias, max) {
  const a = dias[0], b = dias[dias.length - 1];
  const fila = tiras.filter(x => x.ini <= b && x.fin >= a).map(x => {
    const col = Math.max(0, difDias(a, x.ini));
    return { ...x, col, span: Math.min(dias.length - 1, difDias(a, x.fin)) - col + 1, corteI: x.ini < a, corteD: x.fin > b };
  }).sort((x, y) => x.col - y.col || y.barra - x.barra || y.span - x.span || (x.orden < y.orden ? -1 : 1));

  const ocupado = [], total = dias.map(() => 0);
  const enSusDias = (x, fn) => { for (let d = x.col; d < x.col + x.span; d++) if (fn(d)) return true; return false; };
  fila.forEach(x => {
    let c = 0;
    while (enSusDias(x, d => ocupado[c]?.[d])) c++;
    ocupado[c] ||= [];
    enSusDias(x, d => { ocupado[c][d] = true; total[d]++; });
    x.carril = c;
  });

  const ocultos = dias.map(() => 0), visibles = new Set(fila);
  for (let cambio = true; cambio;) {
    cambio = false;
    visibles.forEach(x => {
      if (x.carril < max - 1 || (x.carril === max - 1 && !enSusDias(x, d => total[d] > max || ocultos[d] > 0))) return;
      visibles.delete(x); cambio = true;
      enSusDias(x, d => { ocultos[d]++; });
    });
  }
  const mas = ocultos.map((n, i) => n ? `<button class="ct-mas" style="grid-column:${i + 1};grid-row:${max}" data-act="calVerDia" data-id="${dias[i]}">+${n} más</button>` : '').join('');
  return { html: [...visibles].map(htmlTira).join('') + mas, hayAlgo: fila.length > 0 };
}
function htmlTira(x) {
  const pos = `grid-column:${x.col + 1}/span ${x.span};grid-row:${x.carril + 1}`;
  if (x.t) {
    const hora = x.t.fecha.slice(11, 16), conHora = hora && hora !== '00:00';
    return `<button class="ct ct-tarea ${tmp(x.t.id) ? 'pending' : ''}" style="${pos};--c:${x.t.prioridad === 'Alta' ? 'var(--red)' : 'var(--muted)'}"
      data-act="editarTarea" data-id="${esc(x.t.id)}" title="Tarea: ${esc(x.t.titulo)}"><i></i>${conHora ? `<span class="ct-hora">${hora}</span>` : ''}<span>${esc(x.t.titulo)}</span></button>`;
  }
  const e = x.e, datos = `data-act="verEvento" data-id="${esc(e.id)}" data-ini="${esc(e.inicio)}" title="${esc(e.titulo)}"`;
  const color = `--c:${esc(e.color || 'var(--accent)')}`, pend = tmp(e.id) ? 'pending' : '';
  if (x.barra) return `<button class="ct ct-barra ${pend} ${x.corteI ? 'corte-i' : ''} ${x.corteD ? 'corte-d' : ''}" style="${pos};${color}" ${datos}><span>${esc(e.titulo)}</span></button>`;
  return `<button class="ct ${pend}" style="${pos};${color}" ${datos}><i></i><span class="ct-hora">${e.inicio.slice(11, 16)}</span><span>${esc(e.titulo)}</span></button>`;
}

function vistaMes() {
  const [ini, fin] = rangoVisibleCal(), h = hoy(), mes = S.dia.slice(0, 7), tiras = tirasCal();
  const semanas = Array.from({ length: (difDias(ini, fin) + 1) / 7 }, (_, i) => diasDesde(sumarDias(ini, i * 7), 7));
  const cabecera = semanas[0].map(iso => `<span>${DIAS[aFecha(iso).getDay()].slice(0, 3)}</span>`).join('');
  const filas = semanas.map(dias => `<div class="cm-sem">
    <div class="cm-fondo">${dias.map(iso => {
      const finde = aFecha(iso).getDay() % 6 === 0;
      return `<div class="cm-dia ${iso === h ? 'hoy' : ''} ${iso.slice(0, 7) !== mes ? 'fuera' : ''} ${finde ? 'finde' : ''}" data-act="calDia" data-id="${iso}">
        <button class="cm-num" data-act="calVerDia" data-id="${iso}" aria-label="Ver ${esc(nombreDia(iso, true))}">${aFecha(iso).getDate()}</button></div>`;
    }).join('')}</div>
    <div class="cm-tiras">${colocarCarriles(tiras, dias, S.cal.maxMes).html}</div>
  </div>`).join('');
  return `<div class="cm"><div class="cm-cab">${cabecera}</div><div class="cm-filas">${filas}</div></div>`;
}

/** Reparte en columnas los eventos de un día que se solapan. */
function colocarSolapes(lista) {
  const orden = lista.slice().sort((a, b) => a.ini - b.ini || b.fin - a.fin);
  let grupo = [], finGrupo = -1;
  const cerrar = () => { const n = Math.max(0, ...grupo.map(x => x.col + 1)); grupo.forEach(x => { x.cols = n; }); grupo = []; };
  orden.forEach(x => {
    if (x.ini >= finGrupo) { cerrar(); finGrupo = -1; }
    let col = 0;
    while (grupo.some(o => o.col === col && o.finVisible > x.ini)) col++;
    x.col = col; grupo.push(x);
    finGrupo = Math.max(finGrupo, x.finVisible);
  });
  cerrar();
  return orden;
}

function vistaRejilla(dias) {
  const h = hoy(), tiras = tirasCal(), ahora = new Date();
  const cabecera = dias.map(iso => {
    const d = aFecha(iso);
    return `<button class="cs-dh ${iso === h ? 'hoy' : ''}" data-act="calVerDia" data-id="${iso}"><span>${DIAS[d.getDay()].slice(0, 3)}</span><b>${d.getDate()}</b></button>`;
  }).join('');
  const arriba = colocarCarriles(tiras.filter(x => x.barra || x.t), dias, dias.length === 1 ? 8 : 3);
  const horas = Array.from({ length: 23 }, (_, i) => `<span class="cs-hl" style="top:${(i + 1) * HORA_PX}px">${pad(i + 1)}:00</span>`).join('');
  const columnas = dias.map(iso => {
    const eventos = colocarSolapes(tiras.filter(x => x.e && !x.barra && x.ini === iso).map(x => {
      const ini = minutosDe(x.e.inicio);
      const fin = x.e.fin.slice(0, 10) > iso ? 1440 : minutosDe(x.e.fin);
      // Un evento corto se dibuja con un alto mínimo: también debe contar así al detectar solapes.
      return { e: x.e, ini, fin, finVisible: Math.max(fin, ini + 25) };
    }));
    const html = eventos.map(x => {
      const alto = Math.max((x.fin - x.ini) / 60 * HORA_PX, 20), corto = alto < 36;
      return `<button class="ce ${corto ? 'ce-corto' : ''} ${tmp(x.e.id) ? 'pending' : ''}"
        style="--c:${esc(x.e.color || 'var(--accent)')};top:${x.ini / 60 * HORA_PX}px;height:${alto - 1}px;left:${x.col / x.cols * 100}%;width:calc(${100 / x.cols}% - 3px)"
        data-act="verEvento" data-id="${esc(x.e.id)}" data-ini="${esc(x.e.inicio)}" title="${esc(x.e.titulo)}">
        <b>${esc(x.e.titulo)}</b>${corto ? '' : `<span>${x.e.inicio.slice(11, 16)} – ${x.e.fin.slice(11, 16)}</span>`}${alto >= 66 && x.e.lugar ? `<span>${esc(x.e.lugar)}</span>` : ''}
      </button>`;
    }).join('');
    const linea = iso === h ? `<div class="cs-ahora" style="top:${topAhora(ahora)}px"></div>` : '';
    return `<div class="cs-col ${iso === h ? 'hoy' : ''}" data-act="calHueco" data-id="${iso}">${html}${linea}</div>`;
  }).join('');
  return `<div class="cs ${dias.length === 7 ? 'cs-7' : ''}" style="--n:${dias.length};--hora:${HORA_PX}px">
    <div class="cs-cab"><div></div><div class="cs-dias">${cabecera}</div></div>
    ${arriba.hayAlgo ? `<div class="cs-todo"><div class="cs-tl">Todo<br>el día</div><div class="cs-tiras">${arriba.html}</div></div>` : ''}
    <div class="cg-cuerpo"><div class="cs-grid"><div class="cs-horas">${horas}</div><div class="cs-cols">${columnas}</div></div></div>
  </div>`;
}

/* ---------- Calendario: vista Lista ---------- */
function vistaHorario() {
  if (S.cargando && !S.cargadoEn) return esqueleto();
  const h = S.dia >= hoy() && S.dia <= sumarDias(hoy(), 13) ? hoy() : S.dia;
  const conEventos = new Set(S.eventos.map(e => e.inicio.slice(0, 10)));
  S.tareas.forEach(t => { if (!t.completada && t.fecha) conEventos.add(t.fecha.slice(0, 10)); });
  let dias = '';
  for (let i = 0; i < 14; i++) {
    const iso = sumarDias(h, i), d = aFecha(iso);
    dias += `<button class="day ${iso === S.dia ? 'on' : ''}" data-act="dia" data-id="${iso}">
      <span class="dw">${DIAS[d.getDay()].slice(0, 3)}</span><span class="dn">${d.getDate()}</span>
      <span class="dot ${conEventos.has(iso) ? 'has' : ''}"></span></button>`;
  }
  const delDia = S.eventos.filter(e => e.diaCompleto ? (e.inicio.slice(0, 10) <= S.dia && e.fin.slice(0, 10) > S.dia) : e.inicio.slice(0, 10) === S.dia);
  const todoDia = delDia.filter(e => e.diaCompleto);
  const conHora = delDia.filter(e => !e.diaCompleto).sort((a, b) => a.inicio < b.inicio ? -1 : 1);
  const tareasDia = S.tareas.filter(t => !t.completada && t.fecha && t.fecha.slice(0, 10) === S.dia).sort(ordenTareas);
  const ahora = new Date();
  const [y, m, d] = S.dia.split('-');

  let html = `<div class="days">${dias}</div><div class="day-title">${esc(nombreDia(S.dia, true))}</div>`;
  if (todoDia.length) html += `<div class="allday">${todoDia.map(e => `<button data-act="verEvento" data-id="${esc(e.id)}"
    ${e.color ? `style="background:color-mix(in srgb, ${esc(e.color)} 22%, var(--surface));color:var(--text)"` : ''}>${esc(e.titulo)}</button>`).join('')}</div>`;
  if (conHora.length) {
    html += `<div class="card" style="margin-bottom:18px">${conHora.map(e => {
      const enCurso = aFecha(e.inicio) <= ahora && ahora < aFecha(e.fin);
      return `<button class="ev ${tmp(e.id) ? 'pending' : ''}" data-act="verEvento" data-id="${esc(e.id)}" data-ini="${esc(e.inicio)}">
        <div class="ev-time"><b>${e.inicio.slice(11, 16)}</b><span>${e.fin.slice(11, 16)}</span></div>
        <div class="ev-body ${enCurso ? 'now' : ''}" ${e.color && !enCurso ? `style="border-color:${esc(e.color)}"` : ''}>
          <div class="ev-title">${esc(e.titulo)}</div>
          <div class="row-meta">
            ${e.lugar ? `<span class="m">${ICON.pin(14)}<span>${esc(e.lugar)}</span></span>` : ''}
            ${e.calendario && S.calendarios.length > 1 ? `<span class="cal-name">${esc(e.calendario)}</span>` : ''}
          </div></div>
      </button>`; }).join('')}</div>`;
  }
  if (tareasDia.length) {
    html += `<div class="group"><div class="group-head"><span class="name">Tareas que vencen este día</span></div>
      <div class="card">${tareasDia.map(filaTarea).join('')}</div></div>`;
  }
  if (!delDia.length && !tareasDia.length) html += vacio('cal', 'Día libre', 'No hay nada en el calendario. Toca + para reservar un hueco.');
  html += `<a class="link" href="https://calendar.google.com/calendar/r/day/${y}/${+m}/${+d}" target="_blank" rel="noopener">${ICON.ext(16)} Abrir en Google Calendar</a>`;
  return html;
}

/* ---------- Mapa ---------- */
function pintarMapa() {
  if (!window.L) { $('#map').innerHTML = vacio('map', 'Mapa no disponible', 'No se pudo cargar la librería del mapa. Revisa la conexión.'); return; }
  if (!S.map) {
    S.map = L.map('map', { zoomControl: false, attributionControl: true }).setView([35.889, -5.317], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>', maxZoom: 19,
    }).addTo(S.map);
    S.capa = L.layerGroup().addTo(S.map);
    S.capaRuta = L.layerGroup().addTo(S.map);
    // Tocar el mapa: añadir una parada (modo Paradas) o calcular cómo llegar (modo Mis rutas).
    S.map.on('click', ev => {
      if (S.modoMapa === 'rutas' && S.rutaSel) return;
      const coords = `${ev.latlng.lat.toFixed(6)}, ${ev.latlng.lng.toFixed(6)}`;
      L.popup().setLatLng(ev.latlng).setContent(S.modoMapa === 'rutas'
        ? `<h4>¿Cómo llegar aquí?</h4><span style="color:var(--muted)">Calcula y guarda la ruta en bus, a pie o en coche.</span>
           <button class="btn btn-primary" data-act="rutaHasta" data-id="${coords}">${ICON.route(18)} Crear ruta</button>`
        : `<h4>¿Añadir una parada aquí?</h4><span style="color:var(--muted)">Se guardará como recado en Tareas.</span>
           <button class="btn btn-primary" data-act="paradaAqui" data-id="${coords}">${ICON.plus(18)} Añadir parada</button>`)
        .openOn(S.map);
    });
  }
  setTimeout(() => S.map.invalidateSize(), 0);
  S.capa.clearLayers();
  S.capaRuta.clearLayers();
  document.querySelector('.map-hint')?.remove();
  const seg = `<div class="mapseg">
    <button class="${S.modoMapa === 'paradas' ? 'on' : ''}" data-act="modoMapa" data-id="paradas">Paradas</button>
    <button class="${S.modoMapa === 'rutas' ? 'on' : ''}" data-act="modoMapa" data-id="rutas">Mis rutas${S.rutas.length ? ` <b>${S.rutas.length}</b>` : ''}</button></div>`;
  $('#rpanel').hidden = S.modoMapa !== 'rutas';
  $('#map-bottom').hidden = S.modoMapa === 'rutas';
  if (S.modoMapa === 'rutas') { $('#map-top').innerHTML = seg; return pintarRutas(); }

  const tareas = S.tareas.filter(t => !t.completada && t.ubicacion);
  const tiendas = new Map();
  S.compras.filter(p => p.stock === 'Falta' && p.direccion).forEach(p => {
    const k = p.lat != null ? `${p.lat},${p.lng}` : 'x:' + p.direccion;
    if (!tiendas.has(k)) tiendas.set(k, { nombre: p.tienda || p.direccion, direccion: p.direccion, lat: p.lat, lng: p.lng, items: [] });
    tiendas.get(k).items.push(p.producto);
  });
  const sinUbic = tareas.filter(t => t.lat == null).length + [...tiendas.values()].filter(s => s.lat == null).length;
  const puntos = [];
  const icono = (cls, txt) => L.divIcon({ className: '', html: `<div class="pin ${cls}"><b>${txt}</b></div>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] });

  if (S.capas.t) tareas.filter(t => t.lat != null).sort(ordenTareas).forEach(t => {
    puntos.push([t.lat, t.lng]);
    L.marker([t.lat, t.lng], { icon: icono('pin-t', '!') }).addTo(S.capa)
      .bindPopup(`<h4>${esc(t.titulo)}</h4>${t.fecha ? esc(fechaCorta(t.fecha)) + '<br>' : ''}<span style="color:var(--muted)">${esc(t.ubicacion)}</span>
        ${tmp(t.id) ? '' : `<button class="btn btn-primary" data-act="rutaATarea" data-id="${esc(t.id)}">${ICON.route(16)} Cómo llegar</button>
          <button class="btn btn-ghost" data-act="editarTarea" data-id="${esc(t.id)}">Editar o completar</button>`}`);
  });
  if (S.capas.s) [...tiendas.values()].filter(s => s.lat != null).forEach(s => {
    puntos.push([s.lat, s.lng]);
    L.marker([s.lat, s.lng], { icon: icono('pin-s', s.items.length) }).addTo(S.capa)
      .bindPopup(`<h4>${esc(s.nombre)}</h4><ul>${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`);
  });
  if (puntos.length === 1) S.map.setView(puntos[0], 15);
  else if (puntos.length > 1) S.map.fitBounds(puntos, { padding: [50, 50], maxZoom: 15 });

  $('#map-top').innerHTML = seg + `
    <button class="layer ${S.capas.t ? '' : 'off'}" data-act="capa" data-id="t"><i style="background:var(--blue)"></i>Recados ${tareas.length}</button>
    <button class="layer ${S.capas.s ? '' : 'off'}" data-act="capa" data-id="s"><i style="background:var(--accent)"></i>Tiendas ${tiendas.size}</button>`;
  if (!puntos.length) $('#v-mapa').insertAdjacentHTML('beforeend',
    `<div class="map-hint"><b>Aún no hay paradas</b><span>Toca un punto del mapa o pulsa + para añadir un recado. Las tiendas donde te falta algo aparecen solas.</span></div>`);
  $('#map-bottom').innerHTML = `
    ${sinUbic ? `<span class="map-note">${sinUbic} sin ubicar · revisa la dirección</span>` : ''}
    <a class="btn btn-primary ${puntos.length ? '' : 'disabled'}" href="${urlRuta(puntos)}" target="_blank" rel="noopener">${ICON.route(20)} Ruta en Google Maps</a>`;
}
/* ---------- Mis rutas (trayectos guardados con Google Maps) ---------- */
const MODOS_RUTA = { TRANSIT: 'Transporte público', WALKING: 'A pie', DRIVING: 'Coche' };
const MODO_GMAPS = { TRANSIT: 'transit', WALKING: 'walking', DRIVING: 'driving' };

/** Decodifica el formato "encoded polyline" de Google en [[lat, lng], ...]. */
function decodificar(str) {
  const out = [];
  let i = 0, lat = 0, lng = 0;
  while (i < str.length) {
    for (const k of [0, 1]) {
      let b, s = 0, r = 0;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32);
      const d = r & 1 ? ~(r >> 1) : r >> 1;
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}

const icoPaso = modo => modo === 'TRANSIT' ? ICON.bus(18) : modo === 'DRIVING' ? ICON.car(18) : ICON.walk(18);
function chipLinea(t) {
  const bg = t.color || 'var(--blue)', fg = t.colorTexto || '#fff';
  return `<span class="line" style="background:${esc(bg)};color:${esc(fg)}">${t.tipo === 'BUS' || !t.tipo ? ICON.bus(13) : ICON.train(13)}${esc(t.linea || t.vehiculo)}</span>`;
}
/** Resumen de una opción: 🚶 › L3 › 🚶 */
function resumenOpcion(o) {
  const partes = [];
  o.pasos.forEach(p => {
    if (p.modo === 'TRANSIT' && p.transporte) partes.push(chipLinea(p.transporte));
    else if (partes[partes.length - 1] !== 'walk' && p.modo === 'WALKING') partes.push('walk');
    else if (p.modo === 'DRIVING' && partes[partes.length - 1] !== 'car') partes.push('car');
  });
  return partes.map(p => p === 'walk' ? `<span class="m">${ICON.walk(16)}</span>` : p === 'car' ? `<span class="m">${ICON.car(16)}</span>` : p)
    .join(`<span class="sep">›</span>`);
}

      <button class="icon-btn" data-act="editarRuta" data-id="${esc(r.id)}" aria-label="Editar">${ICON.edit(20)}</button>
    </div>
    ${opciones.length > 1 ? `<div class="opts">${opciones.map((x, k) => `<button class="opt ${k === i ? 'on' : ''}" data-act="opcionRuta" data-id="${k}">
      <b>${esc(x.duracion)}</b><span class="row-meta">${resumenOpcion(x)}</span></button>`).join('')}</div>` : ''}
    ${o ? `
      <div class="rsum"><b>${esc(o.duracion)}</b><span>${o.salida ? `${esc(o.salida)} – ${esc(o.llegada)} · ` : ''}${esc(o.distancia)}${o.tarifa ? ' · ' + esc(o.tarifa) : ''}</span></div>

              <div class="muted">${p.transporte.paradas} parada${p.transporte.paradas === 1 ? '' : 's'} · ${esc(p.duracion)}${p.transporte.empresa ? ' · ' + esc(p.transporte.empresa) : ''}</div>
              <div class="stop"><b>${esc(p.transporte.horaLlegada)}</b> Baja en <b>${esc(p.transporte.hasta)}</b></div>

            <div><span>${esc(p.texto || (p.modo === 'WALKING' ? 'Camina' : 'Conduce'))}</span>

      </ol>
      ${o.avisos.length ? `<p class="aviso">${o.avisos.map(esc).join('<br>')}</p>` : ''}`

      <a class="btn btn-ghost" href="${gmaps}" target="_blank" rel="noopener">${ICON.ext(18)} Google Maps</a>
    </div>`;

  if (!o) return;
  const pts = [];
  const trazos = o.pasos.filter(p => p.polyline).length === o.pasos.length;
  if (trazos) o.pasos.forEach(p => {
    const linea = decodificar(p.polyline);
    pts.push(...linea);
    if (p.modo === 'TRANSIT') {
      L.polyline(linea, { color: '#fff', weight: 9, opacity: .9 }).addTo(S.capaRuta);
      L.polyline(linea, { color: p.transporte?.color || '#3D63A8', weight: 6 }).addTo(S.capaRuta);
      L.circleMarker(linea[0], { radius: 6, color: '#fff', weight: 2, fillColor: p.transporte?.color || '#3D63A8', fillOpacity: 1 })

      L.polyline(linea, { color: p.modo === 'DRIVING' ? '#2F6B4F' : '#77726A', weight: 4, dashArray: p.modo === 'WALKING' ? '2 8' : null, lineCap: 'round' }).addTo(S.capaRuta);
    }
  });
  else { const l = decodificar(o.polyline || ''); pts.push(...l); L.polyline(l, { color: '#3D63A8', weight: 5 }).addTo(S.capaRuta); }
  const pin = (txt, cls) => L.divIcon({ className: '', html: `<div class="pin ${cls}"><b>${txt}</b></div>`, iconSize: [30, 30], iconAnchor: [15, 30] });
  L.marker([o.desde.lat, o.desde.lng], { icon: pin('A', 'pin-s') }).addTo(S.capaRuta);
  L.marker([o.hasta.lat, o.hasta.lng], { icon: pin('B', 'pin-t') }).addTo(S.capaRuta);
  if (pts.length) S.map.fitBounds(pts, rutaPadding());
}

async function guardarRutaRemota(r) {
  const nueva = !r.id;
  const local = nueva ? { ...r, id: 'tmp-' + Date.now(), resultado: null } : null;
  if (nueva) { S.rutas = [...S.rutas, local]; render(); }
  toast('Calculando la ruta con Google Maps…');
  try {
    const { resultado, actualizada, ...enviar } = r;
    const res = await api('guardarRuta', nueva ? { ...enviar, id: '' } : enviar);
    S.rutas = nueva ? S.rutas.map(x => x.id === local.id ? res : x) : S.rutas.map(x => x.id === res.id ? res : x);
    S.rutaSel = res.id; S.opcion = 0; S.modoMapa = 'rutas';
    render(); toast('Ruta guardada');
  } catch (e) {
    if (nueva) S.rutas = S.rutas.filter(x => x.id !== local.id);
    render(); toast(msg(e));
  }
}

/** Ordena los puntos por cercanía (vecino más próximo) y crea el enlace de Google Maps. */
function urlRuta(puntos) {
  if (!puntos.length) return '#';
  const resto = puntos.slice(1), ruta = [puntos[0]];
  while (resto.length) {
    const [la, ln] = ruta[ruta.length - 1];
    let mejor = 0;
    resto.forEach((p, i) => { if ((p[0] - la) ** 2 + (p[1] - ln) ** 2 < (resto[mejor][0] - la) ** 2 + (resto[mejor][1] - ln) ** 2) mejor = i; });
    ruta.push(resto.splice(mejor, 1)[0]);
  }
  const f = p => p.join(',');
  const destino = ruta.pop();
  const paradas = ruta.slice(0, 9).map(f).join('|');
  return `https://www.google.com/maps/dir/?api=1&destination=${f(destino)}${paradas ? '&waypoints=' + encodeURIComponent(paradas) : ''}`;
}

async function guardarOptimista(lista, obj, fn) {
  const nuevo = !obj.id;
  const antes = S[lista].slice();
  const local = nuevo ? { ...obj, id: 'tmp-' + Date.now() } : obj;
  S[lista] = nuevo ? [...S[lista], local] : S[lista].map(x => x.id === obj.id ? { ...x, ...obj } : x);
  render();
  try {
    const { lat, lng, ...enviar } = obj;
    const r = await api(fn, nuevo ? { ...enviar, id: '' } : enviar);
    S[lista] = S[lista].map(x => x.id === local.id ? r : x);
    render();
  } catch (e) {
    S[lista] = antes; render();
    toast('No se pudo guardar: ' + msg(e));
  }
}

async function borrarOptimista(lista, id, fn, texto) {
  const antes = S[lista].slice();
  S[lista] = S[lista].filter(x => x.id !== id);
  render();
  try { await api(fn, id); toast(texto); }
  catch (e) { S[lista] = antes; render(); toast('No se pudo eliminar: ' + msg(e)); }
}

async function setStock(id, stock, deshacer) {
  const p = S.compras.find(x => x.id === id);
  if (!p) return;
  const prev = p.stock;
  p.stock = stock; render();
  if (deshacer) toast(stock === 'En casa' ? `${p.producto} → en casa` : `${p.producto} → a la lista`, () => setStock(id, prev));
  try { await api('cambiarStock', id, stock); }
  catch (e) { p.stock = prev; render(); toast('No se pudo actualizar: ' + msg(e)); }
}

async function setTarea(id, hecha, deshacer) {
  const t = S.tareas.find(x => x.id === id);
  if (!t) return;
  t.completada = hecha; render();
  if (deshacer) toast(hecha ? 'Tarea completada' : 'Tarea reabierta', () => setTarea(id, !hecha));
  try { await api('marcarTarea', id, hecha); }
  catch (e) { t.completada = !hecha; render(); toast('No se pudo actualizar: ' + msg(e)); }
}

async function crearEventoOptimista(ev) {
  const cal = S.calendarios.find(c => c.id === ev.calendario);
  const local = { ...ev, id: 'tmp-' + Date.now(), diaCompleto: false, recurrente: false, color: cal?.color, calendario: cal?.nombre };
  S.eventos.push(local); S.dia = ev.inicio.slice(0, 10);
  if (S.tab !== 'horario') { S.tab = 'horario'; lsSet('tab', 'horario'); }
  render();
  try {
    const r = await api('crearEvento', ev);
    S.eventos = S.eventos.map(x => x.id === local.id ? r : x);
    render(); toast('Añadido a tu calendario');
  } catch (e) {
    S.eventos = S.eventos.filter(x => x.id !== local.id); render();
    toast('No se pudo crear: ' + msg(e));
  }
}

async function borrarEventoOptimista(ev) {
  const antes = S.eventos.slice();
  S.eventos = S.eventos.filter(x => x.id !== ev.id); render();
  try { await api('borrarEvento', ev.id); toast('Evento eliminado'); }
  catch (e) { S.eventos = antes; render(); toast('No se pudo eliminar: ' + msg(e)); }
}

/** Anima la salida de una fila antes de quitarla de la lista. */

  const fila = document.querySelector(`[data-row="${CSS.escape(id)}"]`);
  if (!fila) return fn();
  fila.classList.add('leaving');
  setTimeout(fn, 200);
}

function aplicarProgresoClase(res) {

  S.clase.modo = 'hoja';
  if (S.clase.enVuelo) return;
  const hoja = res.value || {};

    const pendientes = Object.keys(S.clase.hecho).filter(k => !hoja[k]);
    lsSet('claseSubida', '1');
    if (pendientes.length) {
      pendientes.forEach(k => { hoja[k] = true; });
      api('marcarClase', pendientes, true).catch(() => lsSet('claseSubida', ''));
    }

  S.clase.hecho = hoja;
  guardarCacheClase();
}
async function guardarProgresoClase(ids, hecho) {
  if (!ids.length) return;
  const antes = { ...S.clase.hecho };
  ids.forEach(k => { if (hecho) S.clase.hecho[k] = true; else delete S.clase.hecho[k]; });
  guardarCacheClase();
  render();
  if (S.clase.modo === 'local') return;
  S.clase.enVuelo++;
  try { await api('marcarClase', ids, hecho); }
  catch (e) {
    if (sinApiClase(e)) { S.clase.modo = 'local'; render(); }
    else { S.clase.hecho = antes; guardarCacheClase(); render(); toast('No se pudo guardar en la hoja: ' + msg(e)); }

}
const esActividad = it => it.tipo === 'Entrega' || it.tipo === 'Prueba';

function cuentaModulo(m) { return m.unidades.reduce((a, u) => { const c = cuentaUnidad(m, u); return { total: a.total + c.total, hechos: a.hechos + c.hechos }; }, { total: 0, hechos: 0 }); }
function claseTotal() { return CLASE.reduce((a, m) => { const c = cuentaModulo(m); return { total: a.total + c.total, hechos: a.hechos + c.hechos }; }, { total: 0, hechos: 0 }); }
function recorrerClase(fn) { CLASE.forEach(m => m.unidades.forEach(u => u.items.forEach(it => fn(m, u, it)))); }
function entregasUrgentes() {
  let n = 0;
  recorrerClase((m, u, it) => { if (it.tipo === 'Entrega' && it.fecha && it.fecha.slice(0, 10) <= hoy() && !hechoItem(m, u, it)) n++; });

function diasHasta(iso) { return Math.round((aFecha(iso.slice(0, 10)) - aFecha(hoy())) / 864e5); }
function textoDias(n) {

}
function fechasClase() {
  const ahora = new Date(), filas = [];
  recorrerClase((m, u, it) => {
    if (!it.fecha || hechoItem(m, u, it)) return;
    const pasada = aFecha(it.fecha) < ahora;
    if (pasada && it.tipo === 'Prueba') return;
    filas.push({ m, u, it, pasada });
  });
  filas.sort((a, b) => a.it.fecha.localeCompare(b.it.fecha));
  if (!filas.length) return '<div class="row"><span class="row-meta">No queda ninguna fecha pendiente.</span></div>';
  return filas.map(({ m, u, it, pasada }) => {
    const n = diasHasta(it.fecha);
    const clase = pasada ? 'tag-Alta' : n <= 2 ? 'tag-Media' : 'tag-Baja';
    return `<button class="cl-fecha" data-act="clIrUnidad" data-id="${esc(m.id + '|' + u.k)}">
      <span class="cuando">${esc(fechaCorta(it.fecha))}</span>
      <span class="tag ${clase}">${pasada ? 'vencida, ' : ''}${textoDias(n)}</span>
      <b>${esc(it.n)}</b><small>${esc(it.tipo)} · ${esc(m.nombre)}</small>

function resultadosClase() {

    u.items.forEach(it => { if (it.n.toLowerCase().includes(q)) res.push({ m, u, texto: it.n }); });

}

function grupoClase(m, u, titulo, items, clase) {

function marcarNavClase() {

  nav.querySelectorAll('[data-sec]').forEach(b => { const s = $('#' + b.dataset.sec); if (s && s.getBoundingClientRect().top <= limite) actual = b; });

let toastTimer;
function toast(texto, deshacer) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(texto)}</span>${deshacer ? '<button type="button" id="toast-undo">Deshacer</button>' : ''}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), deshacer ? 5000 : 3500);
  if (deshacer) $('#toast-undo').onclick = () => { t.classList.remove('show'); deshacer(); };
}
